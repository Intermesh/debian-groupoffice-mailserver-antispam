# Antispam learning with IMAPSieve
# Moving mail to the Spam folder learns it as spam and moving it out of the Spam folder learns it as ham.
# see https://doc.dovecot.org/2.4.0/howto/antispam.html
#
# This file is linked into /etc/dovecot/conf.d by the groupoffice-mailserver-antispam package.

protocol imap {
  mail_plugins {
    imap_sieve = yes
  }
}

sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

sieve_global_extensions {
  vnd.dovecot.pipe = yes
}

sieve_pipe_bin_dir = /var/lib/dovecot/sieve-pipe

# From elsewhere to Spam folder
mailbox Spam {
  sieve_script spam {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/report-spam.sieve
  }
}

# From Spam folder to elsewhere
imapsieve_from Spam {
  sieve_script ham {
    type = before
    cause = copy
    path = /var/lib/dovecot/sieve/report-ham.sieve
  }
}
